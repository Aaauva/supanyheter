<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {

      font-family: Arial, sans-serif;
      background-color: #121212;

    .navbar {
      background-color: #1e1e1e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar h1 {
      color: #f90;
      margin: 0;
    }
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 15px 20px;
    }
    .category {
      background-color: #333;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
    }
    .thumbnail img {
      width: 100%;
      height: auto;
      display: block;
    }
    .content {
      padding: 10px;
    }
    .title {
      font-size: 14px;
      font-weight: bold;
    }
    .meta {
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
